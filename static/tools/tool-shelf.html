<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>外部工具收藏</title>
<link rel="stylesheet" href="/static/tools/_shared/base.css" />
<style>
  header.top .logo{background:linear-gradient(135deg,#7c3aed,#4f46e5)}
  .sub{color:var(--muted);font-size:12.5px}
  .form-grid{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 12px;align-items:start}
  .form-grid .full{grid-column:1 / -1}
  .form-grid textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:9px;
    font-family:inherit;font-size:14px;resize:vertical;min-height:62px;background:#fff;color:var(--ink)}
  .form-grid textarea:focus{outline:2px solid rgba(37,99,235,.18);border-color:var(--accent)}
  .form-foot{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:12px}
  button.primary{font-family:inherit;font-size:13.5px;font-weight:650;padding:9px 20px;border:0;
    border-radius:9px;background:var(--accent);color:#fff;cursor:pointer}
  button.primary:hover{background:var(--accent-dark)}
  button.primary:disabled{opacity:.55;cursor:not-allowed}
  button.ghost{font-family:inherit;font-size:13px;padding:9px 14px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--muted);cursor:pointer}
  button.ghost:hover{background:#f7f8fa;color:var(--ink)}
  .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
  .toolbar input[type=text]{flex:1;min-width:200px}
  .count{font-size:12.5px;color:var(--muted);white-space:nowrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);
    background:#fff;color:var(--muted);cursor:pointer}
  .chip:hover{border-color:var(--accent);color:var(--accent-dark)}
  .chip.on{background:var(--accent-soft);border-color:#c7dbff;color:var(--accent-dark);font-weight:600}
  .item{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:10px;background:#fff}
  .item .head{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
  .item .name{font-size:14.5px;font-weight:700;color:#0f172a;text-decoration:none;word-break:break-all}
  .item .name:hover{color:var(--accent-dark);text-decoration:underline}
  .item .purpose{font-size:13px;line-height:1.75;color:#1f2937;margin-top:5px}
  .item .purpose.empty{color:var(--muted);font-style:italic}
  .item .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
  .item .tag{font-size:11px;padding:1.5px 8px;border-radius:999px;background:#f1f2f5;color:var(--muted)}
  .item .foot{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
  .link-btn{font-size:11.5px;border:1px solid var(--line);border-radius:7px;padding:4px 9px;
    text-decoration:none;color:var(--accent-dark);background:#fff;cursor:pointer}
  .link-btn:hover{background:#f7f8fa}
  .link-btn.danger{color:var(--err)}
  .link-btn.danger:hover{background:#fff7f6;border-color:#f3c9c4}
  .item .url{word-break:break-all;color:var(--muted)}
  .empty{text-align:center;color:var(--muted);padding:40px 16px;font-size:13px}
  .empty .big{font-size:34px;margin-bottom:8px}
  .msg{border-radius:9px;padding:10px 13px;font-size:12.5px;line-height:1.7;margin-bottom:12px;display:none}
  .msg.show{display:block}
  .msg.err{background:#fff7f6;border:1px solid #f3c9c4;color:#a4261b}
  .msg.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#0f7b3d}
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="logo">🧰</div>
    <div>
      <h1>外部工具收藏</h1>
      <div class="sub">名称 + 一句话作用 + 链接，存本地 <code>work/toolshelf/items.json</code></div>
    </div>
  </header>

  <div class="msg" id="shelfMsg"></div>

  <div class="card">
    <h2 id="formTitle">添加一条收藏</h2>
    <div class="form-grid">
      <div>
        <label for="shelfName">工具名 *</label>
        <input type="text" id="shelfName" placeholder="例如 gstack" maxlength="80" />
      </div>
      <div>
        <label for="shelfUrl">链接 *</label>
        <input type="text" id="shelfUrl" placeholder="https://github.com/owner/repo" maxlength="500" />
      </div>
      <div class="full">
        <label for="shelfPurpose">作用（一句话）</label>
        <textarea id="shelfPurpose" maxlength="300" placeholder="它是做什么的、解决什么问题，1~2 句即可"></textarea>
      </div>
      <div class="full">
        <label for="shelfTags">标签（逗号分隔，最多 8 个）</label>
        <input type="text" id="shelfTags" placeholder="例如 Claude Code, 工作流" maxlength="180" />
      </div>
    </div>
    <div class="form-foot">
      <button class="primary" id="shelfSubmit" type="button">添加到收藏</button>
      <button class="ghost" id="shelfCancel" type="button" style="display:none">取消编辑</button>
      <span class="count" id="shelfHint">链接会原样保存，不做自动校验</span>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="shelfSearch" placeholder="搜索名称、作用、标签或链接…" />
    <span class="count" id="shelfCount">—</span>
  </div>
  <div class="chips" id="shelfTags"></div>

  <div id="shelfList"></div>
  <div class="empty" id="shelfEmpty" style="display:none">
    <div class="big">🧰</div>
    <div>还没有收藏，从上面添加第一条吧</div>
  </div>
</div>

<script>
'use strict';

const $ = (id) => document.getElementById(id);
const state = { items: [], tags: [], editingId: null, keyword: '', tagFilter: '' };

function esc(text) {
  return String(text == null ? '' : text).replace(/[&<>"']/g, (ch) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[ch]));
}

async function api(url, options) {
  const response = await fetch(url, options);
  let data = {};
  try { data = await response.json(); } catch (e) { /* ignore */ }
  if (!response.ok) throw new Error((data && data.detail) || ('HTTP ' + response.status));
  return data;
}

function message(text, kind) {
  const box = $('shelfMsg');
  if (!text) { box.className = 'msg'; box.innerHTML = ''; return; }
  box.className = 'msg show ' + (kind || 'ok');
  box.innerHTML = esc(text);
}

function fields() {
  return {
    name: $('shelfName').value.trim(),
    url: $('shelfUrl').value.trim(),
    purpose: $('shelfPurpose').value.trim(),
    tags: $('shelfTags').value.trim()
  };
}

function clearForm() {
  state.editingId = null;
  $('shelfName').value = '';
  $('shelfUrl').value = '';
  $('shelfPurpose').value = '';
  $('shelfTags').value = '';
  $('shelfSubmit').textContent = '添加到收藏';
  $('shelfCancel').style.display = 'none';
  $('formTitle').textContent = '添加一条收藏';
}

function visible() {
  const query = state.keyword.trim().toLowerCase();
  return state.items.filter((item) => {
    if (state.tagFilter && !(item.tags || []).some((t) => t.toLowerCase() === state.tagFilter.toLowerCase())) {
      return false;
    }
    if (!query) return true;
    const hay = [item.name, item.purpose, item.url, (item.tags || []).join(' ')].join(' ').toLowerCase();
    return hay.includes(query);
  });
}

function renderTags() {
  const box = $('shelfTags');
  if (!state.tags.length) { box.innerHTML = ''; return; }
  box.innerHTML = state.tags.map((tag) => {
    const on = state.tagFilter.toLowerCase() === tag.toLowerCase() ? ' on' : '';
    return '<span class="chip' + on + '" data-tag="' + esc(tag) + '">' + esc(tag) + '</span>';
  }).join('');
  box.querySelectorAll('.chip').forEach((chip) => {
    chip.addEventListener('click', () => {
      const tag = chip.getAttribute('data-tag');
      state.tagFilter = state.tagFilter.toLowerCase() === tag.toLowerCase() ? '' : tag;
      renderTags(); renderList();
    });
  });
}

function renderList() {
  const items = visible();
  $('shelfCount').textContent = state.keyword || state.tagFilter
    ? '匹配 ' + items.length + ' / 共 ' + state.items.length + ' 条'
    : '共 ' + state.items.length + ' 条';
  $('shelfEmpty').style.display = state.items.length ? 'none' : 'block';
  if (state.items.length && !items.length) {
    $('shelfList').innerHTML = '<div class="empty"><div class="big">🔍</div><div>没有匹配的收藏</div></div>';
    return;
  }
  $('shelfList').innerHTML = items.map((item) => {
    const purpose = item.purpose
      ? '<div class="purpose">' + esc(item.purpose) + '</div>'
      : '<div class="purpose empty">还没有写作用</div>';
    const tags = (item.tags || []).length
      ? '<div class="tags">' + item.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>'
      : '';
    const added = String(item.added_at || '').replace('T', ' ').slice(0, 16);
    return '<div class="item" data-id="' + esc(item.id) + '">'
      + '<div class="head"><a class="name" href="' + esc(item.url) + '" target="_blank" rel="noreferrer">'
      + esc(item.name) + '</a></div>'
      + purpose + tags
      + '<div class="foot">'
      + '<span class="url">' + esc(item.url) + '</span>'
      + '<span>' + esc(added) + '</span>'
      + '<a class="link-btn" href="' + esc(item.url) + '" target="_blank" rel="noreferrer">打开 ↗</a>'
      + '<button class="link-btn" data-act="edit">编辑</button>'
      + '<button class="link-btn danger" data-act="delete">删除</button>'
      + '</div></div>';
  }).join('');

  $('shelfList').querySelectorAll('.item').forEach((node) => {
    const id = node.getAttribute('data-id');
    const edit = node.querySelector('[data-act="edit"]');
    const del = node.querySelector('[data-act="delete"]');
    if (edit) edit.addEventListener('click', () => startEdit(id));
    if (del) del.addEventListener('click', () => removeItem(id));
  });
}

function startEdit(id) {
  const item = state.items.find((entry) => entry.id === id);
  if (!item) return;
  state.editingId = id;
  $('shelfName').value = item.name || '';
  $('shelfUrl').value = item.url || '';
  $('shelfPurpose').value = item.purpose || '';
  $('shelfTags').value = (item.tags || []).join(', ');
  $('shelfSubmit').textContent = '保存修改';
  $('shelfCancel').style.display = 'inline-block';
  $('formTitle').textContent = '正在编辑：' + (item.name || '');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  $('shelfName').focus();
}

async function removeItem(id) {
  const item = state.items.find((entry) => entry.id === id);
  if (!item) return;
  if (!window.confirm('确定删除「' + item.name + '」这条收藏？')) return;
  try {
    await api('/api/toolshelf/items/' + encodeURIComponent(id), { method: 'DELETE' });
    if (state.editingId === id) clearForm();
    message('已删除：' + item.name, 'ok');
    await load();
  } catch (err) {
    message('删除失败：' + err.message, 'err');
  }
}

async function submit() {
  const body = fields();
  if (!body.name) { message('请填写工具名', 'err'); $('shelfName').focus(); return; }
  if (!body.url) { message('请填写链接', 'err'); $('shelfUrl').focus(); return; }
  const editing = state.editingId;
  $('shelfSubmit').disabled = true;
  $('shelfSubmit').textContent = editing ? '保存中…' : '添加中…';
  try {
    const url = editing ? '/api/toolshelf/items/' + encodeURIComponent(editing) : '/api/toolshelf/items';
    const data = await api(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    message((editing ? '已保存：' : '已添加：') + (data.item && data.item.name ? data.item.name : body.name), 'ok');
    clearForm();
    await load();
  } catch (err) {
    message((editing ? '保存失败：' : '添加失败：') + err.message, 'err');
  } finally {
    $('shelfSubmit').disabled = false;
    $('shelfSubmit').textContent = state.editingId ? '保存修改' : '添加到收藏';
  }
}

async function load() {
  try {
    const data = await api('/api/toolshelf/items');
    state.items = data.items || [];
    state.tags = data.tags || [];
    renderTags(); renderList();
  } catch (err) {
    message('读取收藏失败：' + err.message, 'err');
  }
}

$('shelfSubmit').addEventListener('click', submit);
$('shelfCancel').addEventListener('click', () => { clearForm(); message(''); });
$('shelfSearch').addEventListener('input', () => { state.keyword = $('shelfSearch').value; renderList(); });
['shelfName', 'shelfUrl', 'shelfPurpose', 'shelfTags'].forEach((id) => {
  $(id).addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); submit(); }
  });
});

load();
</script>
</body>
</html>
