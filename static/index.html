<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>工具箱</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --ink:#1b1d21; --muted:#6b7280; --line:#e6e8ec;
    --accent:#ff2d55; --accent-soft:#fff0f3; --ok:#12a150;
    --radius:12px; --shadow:0 1px 2px rgba(16,24,40,.05), 0 8px 24px rgba(16,24,40,.06);
    --sidebar:250px;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink); display:flex; overflow:hidden;
    font-family:"PingFang SC","Microsoft YaHei","Segoe UI",system-ui,-apple-system,sans-serif;
    font-size:14px; line-height:1.6;
  }
  /* ---------------- 左侧工具列表 ---------------- */
  .sidebar{
    width:var(--sidebar); flex:0 0 var(--sidebar); height:100vh; background:var(--panel);
    border-right:1px solid var(--line); display:flex; flex-direction:column;
  }
  .brand{display:flex; align-items:center; gap:10px; padding:16px 16px 12px}
  .brand .logo{
    width:34px;height:34px;border-radius:10px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;flex:0 0 auto;
  }
  .brand h1{font-size:15.5px;margin:0;font-weight:650;letter-spacing:.2px}
  .brand .sub{color:var(--muted);font-size:11.5px}
  nav.tools{flex:1; overflow-y:auto; padding:6px 10px 12px}
  .nav-item{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    padding:10px 11px; margin-bottom:4px; border:1px solid transparent; border-radius:10px;
    background:transparent; cursor:pointer; font-family:inherit; color:inherit;
    border-left:3px solid transparent; transition:.15s;
  }
  .nav-item:hover{background:#f4f5f7}
  .nav-item.active{background:var(--accent-soft); border-color:#ffd6de; border-left-color:var(--accent)}
  .nav-item .ico{font-size:17px; line-height:1.3; flex:0 0 auto}
  .nav-item .txt{min-width:0}
  .nav-item .nm{font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .nav-item .ds{font-size:11.5px; color:var(--muted); line-height:1.45;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
  .nav-group{font-size:11px; color:#9aa0ad; padding:10px 11px 4px; letter-spacing:.5px}
  .side-foot{border-top:1px solid var(--line); padding:11px 14px; color:var(--muted); font-size:11.5px; line-height:1.6}
  .side-foot code{background:#f1f2f5; padding:1px 4px; border-radius:4px; font-size:11px; word-break:break-all}
  .side-model-wrap{border-top:1px solid var(--line); padding:10px 12px}
  .side-model-btn{width:100%; font-family:inherit; font-size:12px; font-weight:600; padding:8px 10px;
    border:1px solid var(--line); border-radius:8px; background:#fff; color:var(--ink); cursor:pointer}
  .side-model-btn:hover{background:#f7f8fa}
  .modal{position:fixed; inset:0; background:rgba(16,24,40,.45); z-index:80; display:flex;
    align-items:flex-start; justify-content:center; padding:40px 16px; overflow:auto}
  .modal.hidden{display:none}
  .dialog{width:min(500px,100%); background:#fff; border-radius:14px; padding:20px 22px;
    box-shadow:0 18px 50px rgba(16,24,40,.22)}
  .dialog h2{font-size:17px; margin:0 0 4px}
  .dialog .sub{color:var(--muted); font-size:12px; line-height:1.7; margin-bottom:14px}
  .dialog .field{margin-bottom:12px}
  .dialog label{display:block; font-size:12px; font-weight:600; margin-bottom:5px}
  .dialog input,.dialog select{width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; font-family:inherit; font-size:13px; background:#fff; color:var(--ink)}
  .dialog .hint{color:var(--muted); font-size:11.5px; line-height:1.7}
  .dialog .status{font-size:12px; line-height:1.7; margin:8px 0; color:var(--muted)}
  .dialog .actions{display:flex; justify-content:flex-end; gap:8px; margin-top:14px}
  .dialog .actions button{font-family:inherit; font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:8px; cursor:pointer}
  .dialog .actions .ghost{border:1px solid var(--line); background:#fff; color:var(--ink)}
  .dialog .actions .primary{border:1px solid var(--accent); background:var(--accent); color:#fff}
  .dialog .actions button:disabled{opacity:.55; cursor:not-allowed}
  /* ---------------- 右侧工具面板 ---------------- */
  .stage{flex:1; min-width:0; height:100vh; display:flex; flex-direction:column}
  .topbar{
    display:flex; align-items:center; gap:10px; padding:11px 16px; background:var(--panel);
    border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .topbar .cur{display:flex; align-items:center; gap:8px; font-size:14px; min-width:0}
  .topbar .cur .ico{font-size:16px}
  .topbar .cur strong{font-weight:650; white-space:nowrap}
  .topbar .desc{color:var(--muted); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .grow{flex:1; min-width:8px}
  button.sm{
    font-family:inherit;font-size:12.5px;font-weight:550;padding:5px 11px;border-radius:7px;
    border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;
  }
  button.sm:hover{background:#f3f4f6}
  iframe{flex:1; width:100%; border:0; background:var(--bg); display:block}
  .empty{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:8px; color:var(--muted); text-align:center; padding:30px;
  }
  .empty h2{font-size:15px; margin:0; color:var(--ink)}
  .empty code{background:#f1f2f5; padding:2px 6px; border-radius:5px; font-size:12px}
  /* ---------------- 窄屏 ---------------- */
  @media (max-width:760px){
    body{flex-direction:column; overflow:auto}
    .sidebar{width:100%; flex:0 0 auto; height:auto; border-right:0; border-bottom:1px solid var(--line)}
    nav.tools{display:flex; gap:6px; overflow-x:auto; padding:6px 10px 10px}
    .nav-item{flex:0 0 auto; width:auto; min-width:150px; margin:0}
    .nav-item .ds{display:none}
    .side-model-wrap{display:block}
    .stage{height:auto; flex:1}
    iframe{min-height:70vh}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">箱</div>
      <div>
        <h1>工具箱</h1>
        <div class="sub" id="countLabel">加载中…</div>
      </div>
    </div>
    <nav class="tools" id="toolNav"></nav>
    <div class="side-model-wrap">
      <button class="side-model-btn" id="btnModelSettings" type="button" title="设置默认大模型厂商">
        ⚙ 默认模型设置
      </button>
    </div>
  </aside>

  <main class="stage">
    <header class="topbar">
      <div class="cur"><span class="ico" id="curIcon">🔧</span><strong id="curName">—</strong></div>
      <span class="desc" id="curDesc"></span>
      <div class="grow"></div>
      <button class="sm" id="btnReload">重新加载</button>
    </header>
    <iframe id="frame" title="工具面板" allow="microphone"></iframe>
    <div class="empty" id="empty" style="display:none">
      <h2>还没有工具</h2>
      <div>往 <code>static/tools/</code> 里放一个 <code>xxx.html</code> 和一个 <code>xxx.meta.json</code> 就会出现。</div>
    </div>
  </main>

  <div class="modal hidden" id="modelModal">
    <div class="dialog">
      <h2>默认模型设置</h2>
      <div class="sub">没有单独设置模型的工具会使用这里；某个工具单独设置了大模型，则优先使用该工具自己的设置。</div>
      <div class="field">
        <label for="gmProvider">大模型厂商</label>
        <select id="gmProvider"></select>
      </div>
      <div id="gmFields"></div>
      <div class="status" id="gmStatus"></div>
      <div class="actions">
        <button class="ghost" id="gmCancel" type="button">取消</button>
        <button class="primary" id="gmSave" type="button">保存</button>
      </div>
    </div>
  </div>

<script>
let tools = [], currentId = "";
const $ = (id) => document.getElementById(id);

function renderNav(){
  $("countLabel").textContent = tools.length + " 个工具";
  $("toolNav").innerHTML = tools.map(t => `
    <button class="nav-item" data-id="${t.id}" title="${escapeHtml(t.description)}">
      <span class="ico">${escapeHtml(t.icon)}</span>
      <span class="txt">
        <span class="nm">${escapeHtml(t.name)}</span>
        <span class="ds">${escapeHtml(t.description)}</span>
      </span>
    </button>`).join("");
  $("toolNav").querySelectorAll(".nav-item").forEach(btn => {
    btn.onclick = () => select(btn.getAttribute("data-id"));
  });
}
function escapeHtml(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function select(id){
  const tool = tools.find(t => t.id === id) || tools[0];
  if(!tool) return;
  currentId = tool.id;
  $("toolNav").querySelectorAll(".nav-item").forEach(el =>
    el.classList.toggle("active", el.getAttribute("data-id") === tool.id));
  $("curIcon").textContent = tool.icon;
  $("curName").textContent = tool.name;
  $("curDesc").textContent = tool.description || "";
  if($("frame").getAttribute("src") !== tool.url) $("frame").src = tool.url;
  // 用 hash 记住当前工具，刷新/收藏都能回到同一个
  const want = "#/" + tool.id;
  if(location.hash !== want) history.replaceState(null, "", want);
  document.title = tool.name + " · 工具箱";
}

/* ---------------- 默认模型设置 ---------------- */
let defaultModel = null;

function renderModelFields(){
  const provider = $("gmProvider").value;
  const settings = defaultModel || {};
  const fields = $("gmFields");
  if(provider === "inherit"){
    fields.innerHTML = "";
    return;
  }
  const keyHint = settings.api_key_masked
    ? "已保存：" + settings.api_key_masked + "（留空保持）"
    : "填写 API key";
  const isCustomLike = provider === "custom" || provider === "local";
  const baseField = isCustomLike
    ? `<div class="field"><label for="gmBase">Base URL</label>
       <input id="gmBase" value="${escapeHtml(settings.base_url || "")}" placeholder="${provider === "local" ? "http://127.0.0.1:11434/v1" : "https://api.example.com/v1"}" /></div>`
    : "";
  fields.innerHTML = `<div class="field"><label for="gmModel">模型名${provider === "local" ? "（本地模型必填）" : "（可选）"}</label>
    <input id="gmModel" value="${escapeHtml(settings.model || "")}" placeholder="${provider === "local" ? "例如 qwen2.5:7b" : "留空用厂商默认模型"}" /></div>
    ${baseField}
    <div class="field"><label for="gmKey">API key${provider === "local" ? "（本地模型可留空）" : "（可选）"}</label>
    <input id="gmKey" type="password" autocomplete="off" placeholder="${escapeHtml(keyHint)}" /></div>`;
}

function renderDefaultModel(){
  const settings = defaultModel || {};
  $("gmProvider").innerHTML = (settings.options || []).map((item) =>
    `<option value="${escapeHtml(item.value)}"${item.value === settings.provider ? " selected" : ""}>${escapeHtml(item.label)}</option>`
  ).join("");
  renderModelFields();
  const eff = settings.effective || {};
  $("gmStatus").innerHTML = eff.error
    ? `<span style="color:#a4261b">${escapeHtml(eff.error)}</span>`
    : `当前默认：<b>${escapeHtml(eff.label || "—")} / ${escapeHtml(eff.model || "—")}</b>`
      + (eff.api_key_set ? "" : `<br /><span style="color:#a16800">还没有可用 API key</span>`)
      + `<br />各工具如果单独设置了模型，会优先使用工具自己的设置。`;
  $("btnModelSettings").title = eff.error ? "默认模型设置（未配置完整）"
    : `默认模型：${eff.label || ""} / ${eff.model || ""}`;
}

async function loadDefaultModel(){
  try{
    const res = await fetch("/api/model/settings");
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
    defaultModel = data.settings;
    renderDefaultModel();
  }catch(e){
    $("gmStatus").innerHTML = `<span style="color:#a4261b">${escapeHtml(e.message)}</span>`;
  }
}

function openModelModal(){
  $("modelModal").classList.remove("hidden");
  if(defaultModel) renderDefaultModel();
  else loadDefaultModel();
}

async function saveDefaultModel(){
  const provider = $("gmProvider").value;
  const payload = {
    provider,
    model: $("gmModel") ? $("gmModel").value.trim() : "",
    base_url: $("gmBase") ? $("gmBase").value.trim() : "",
    api_key: $("gmKey") ? $("gmKey").value.trim() : ""
  };
  $("gmSave").disabled = true;
  $("gmSave").textContent = "保存中…";
  try{
    const res = await fetch("/api/model/settings", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.detail || ("HTTP " + res.status));
    defaultModel = data.settings;
    renderDefaultModel();
    $("gmStatus").innerHTML += `<br /><span style="color:#0f7b3d">已保存。</span>`;
  }catch(e){
    $("gmStatus").innerHTML = `<span style="color:#a4261b">${escapeHtml(e.message)}</span>`;
  }finally{
    $("gmSave").disabled = false;
    $("gmSave").textContent = "保存";
  }
}

$("btnModelSettings").onclick = openModelModal;
$("gmCancel").onclick = () => $("modelModal").classList.add("hidden");
$("gmProvider").onchange = renderModelFields;
$("gmSave").onclick = saveDefaultModel;
$("modelModal").addEventListener("click", (event) => {
  if(event.target === $("modelModal")) $("modelModal").classList.add("hidden");
});
document.addEventListener("keydown", (event) => {
  if(event.key === "Escape") $("modelModal").classList.add("hidden");
});
loadDefaultModel();
async function boot(){
  try{
    const res = await fetch("/api/tools");
    tools = (await res.json()).tools || [];
  } catch(e){
    $("countLabel").textContent = "工具列表加载失败";
    return;
  }
  if(!tools.length){
    $("frame").style.display = "none";
    $("empty").style.display = "flex";
    return;
  }
  renderNav();
  select((location.hash || "").replace(/^#\/?/, ""));
}
window.addEventListener("hashchange", () => {
  const id = (location.hash || "").replace(/^#\/?/, "");
  if(id && id !== currentId) select(id);
});
$("btnReload").onclick = () => { if(currentId) $("frame").src = "/tool/" + currentId; };
boot();
</script>
</body>
</html>
